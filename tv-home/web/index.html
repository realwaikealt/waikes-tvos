<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waike’s tvOS</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<!-- Night look only: five scenes that take turns (photo, glass clock, the cut-out in front), built by app.js -->
<div class="scenes" id="scenes" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<header class="top">
  <div class="top-left">
    <div class="people-wrap">
      <div class="people" id="people"></div>
      <!-- three or more people: the list the head icon opens -->
      <div class="people-pop" id="people-pop" role="listbox" aria-label="Who is watching"></div>
    </div>
    <div class="hero" id="hero" aria-live="polite">
      <h1 id="hero-title"></h1>
      <p id="hero-sub"></p>
    </div>
  </div>
  <div class="clock">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
    <div class="place" id="place"></div>
    <div class="quick" id="quick">
      <!-- the quick buttons from tvs[].quick in config.json, drawn by app.js -->
      <div class="qbtns" id="qbtns"></div>
      <div class="sleep-menu" id="sleep-menu"></div>
    </div>
    <p class="quick-note" id="quick-note"></p>
  </div>
</header>

<main class="home">
  <section class="shelf" id="shelf-section" aria-labelledby="shelf-title">
    <header class="shelf-head">
      <h2 id="shelf-title">Keep watching</h2>
      <p class="status" id="status"></p>
    </header>
    <div class="shelf-track" id="shelf"></div>
  </section>

  <section class="apps" aria-label="Apps">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="settings about" id="about" role="dialog" aria-label="About Waike’s tvOS">
  <div class="settings-panel about-panel">
    <div class="about-scroll" id="about-body"></div>
    <p class="settings-help">Up and down to read. OK or Back to close.</p>
  </div>
</div>

<div class="pin" id="pin" role="dialog" aria-label="PIN">
  <div class="pin-panel" id="pin-panel">
    <h2 id="pin-title">Enter PIN</h2>
    <div class="pin-boxes" id="pin-boxes"></div>
    <p class="pin-note" id="pin-note"></p>
    <p class="pin-help">Up and down change the digit. Left and right move. OK to confirm. Back to cancel. You can also type the numbers.</p>
  </div>
</div>

<div class="settings" id="settings" role="dialog" aria-label="Settings">
  <div class="settings-panel">
    <h2>Settings</h2>
    <div class="settings-list" id="settings-list"></div>
    <p class="settings-note" id="settings-note"></p>
    <p class="settings-help">Up and down to choose. Left and right to change. Back to close.</p>
  </div>
</div>

<div class="settings ask" id="ask" role="dialog" aria-label="Ask Claude">
  <div class="settings-panel ask-panel">
    <h2>Ask Claude</h2>
    <p class="ask-q" id="ask-q"></p>
    <div class="ask-a" id="ask-a"></div>
    <div class="settings-list" id="ask-list"></div>
    <p class="settings-note" id="ask-note"></p>
    <p class="settings-help" id="ask-help"></p>
  </div>
</div>

<script src="config.js"></script>
<script src="arrange-rules.js"></script>
<script src="arrange.js"></script>
<script src="app.js"></script>
</body>
</html>
