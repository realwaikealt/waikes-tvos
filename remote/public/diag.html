<h1>Remote diagnostics</h1>
<p>This page works without the app. Screenshot it if something is wrong.</p>

<script>
(function(){
function run(){
var o=document.getElementById('out'),L=[];function p(k,v){L.push(k+': '+v);o.textContent=L.join('\n');}

.then(function(){return new Promise(function(res){var t0=Date.now(),es,done=false;function fin(m){if(done)return;done=true;try{es.close();}catch(e){}p('live stream (EventSource /api/events)',m+' '+(Date.now()-t0)+'ms');res();}try{es=new EventSource('/api/events');}catch(e){fin('FAILED '+e);return;}es.addEventListener('now',function(){fin('ok, first event');});es.onerror=function(){fin('FAILED (the app then polls every 2 s)');};setTimeout(function(){fin('FAILED no event in 6 s');},6000);});})
.then(function(){

}
