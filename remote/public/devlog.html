<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#120d13"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Dev log</title>
<style>:root{color-scheme:dark;--ground:#120d13;--panel:#221820;--ink:#f5f5f7;--ink2:rgba(245,245,247,.64);--ink3:rgba(245,245,247,.48);--rim:rgba(255,255,255,.1);--font:-apple-system,'SF Pro Text',system-ui,'Helvetica Neue',sans-serif;--font-d:-apple-system,'SF Pro Display',system-ui,'Helvetica Neue',sans-serif}*{box-sizing:border-box}html,body{background:var(--ground);color:var(--ink);margin:0;font:400 17px/1.45 var(--font);-webkit-font-smoothing:antialiased}body{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font:700 30px/1.12 var(--font-d);letter-spacing:-.02em;margin:0}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}.ver{text-align:right;font-size:14px;color:var(--ink3)}.ver b{display:block;color:var(--ink);font-size:16px}
.chips{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;position:sticky;top:0;background:var(--ground);padding:6px 0 8px;z-index:3}.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:0;background:rgba(255,255,255,.08);color:var(--ink2);font:600 15px var(--font);touch-action:manipulation;transition:transform .32s cubic-bezier(.34,1.4,.64,1),background .2s}.chip:active{transform:scale(.94);transition-duration:.07s}.chip[aria-pressed=true]{background:#fff;color:#111}.chip i{font-style:normal;opacity:.65;margin-left:4px}
.day{font:700 13px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 4px 10px}
.item{background:var(--panel);border-radius:20px;padding:14px 16px;margin:0 0 10px;box-shadow:inset 0 0 0 1px var(--rim);width:100%;text-align:left;border:0;color:inherit;font:inherit;display:block;touch-action:manipulation;transition:transform .32s cubic-bezier(.34,1.4,.64,1)}.item:active{transform:scale(.985);transition-duration:.07s}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3);margin-bottom:4px}.meta .v{margin-left:auto;font-variant-numeric:tabular-nums}.t{padding:1px 9px;border-radius:7px;font-weight:700;background:rgba(255,255,255,.12);color:var(--ink)}.t-new{background:rgba(120,200,140,.25);color:#aef0c1}.t-improved{background:rgba(120,170,255,.25);color:#bcd3ff}.t-fixed{background:rgba(255,190,110,.25);color:#ffd9a3}.t-security{background:rgba(255,140,130,.25);color:#ffc3bd}
.title{font:700 18px/1.25 var(--font-d);letter-spacing:-.01em}.sum{color:var(--ink2);margin-top:2px}ul{margin:10px 0 2px 18px;padding:0;color:var(--ink2);font-size:15px}li{margin:4px 0}.msg{color:var(--ink2);text-align:center;padding:40px 0}.foot{color:var(--ink3);font-size:15px;margin-top:26px}.foot a{color:var(--ink2)}
.sk{height:84px;border-radius:20px;background:rgba(255,255,255,.06);margin-bottom:10px;position:relative;overflow:hidden}.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-100%);animation:sw 1.4s ease-in-out infinite}@keyframes sw{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.chip,.item{transition:none}.sk::after{animation:none}}</style></head><body>
<div class="top"><h1>Dev log</h1><div class="ver" id="ver"></div></div>
<div class="chips" id="chips" role="group" aria-label="Filter"></div>
<div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<p class="foot"><a href="/">Open the remote</a></p>
<script>
(function(){
var T={"new":"New","improved":"Improved","fixed":"Fixed","security":"Security","internal":"Behind the scenes"};
var F=[["All",null],["New","new"],["Improved","improved"],["Fixed","fixed"]],fi=0,all=[],open={};
var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],L=["January","February","March","April","May","June","July","August","September","October","November","December"],D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pd(d){var p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function ck(t){var p=t.split(":"),h=+p[0];return((h+11)%12+1)+":"+p[1]+" "+(h<12?"AM":"PM")}
function chips(){document.getElementById("chips").innerHTML=F.map(function(f,i){var n=all.filter(function(x){return!f[1]||x.type===f[1]}).length;return'<button class="chip" data-i="'+i+'" aria-pressed="'+(i===fi)+'">'+f[0]+'<i>'+n+'</i></button>'}).join("")}
function draw(){var rows=all.filter(function(x){return!F[fi][1]||x.type===F[fi][1]}).slice().reverse(),o="",day="";
 if(!rows.length){document.getElementById("list").innerHTML='<div class="msg">Nothing here yet.</div>';return}
 rows.forEach(function(x){if(x.date!==day){day=x.date;var t=pd(day);o+='<div class="day">'+D[t.getDay()]+", "+L[t.getMonth()]+" "+t.getDate()+"</div>"}
  o+='<button class="item" data-id="'+e(x.id)+'" aria-expanded="'+!!open[x.id]+'"><div class="meta"><span class="t t-'+e(x.type)+'">'+e(T[x.type]||x.type)+'</span><span>'+ck(x.time)+'</span><span class="v">'+e(x.version)+'</span></div><div class="title">'+e(x.title)+'</div><div class="sum">'+e(x.summary)+'</div>'+(open[x.id]&&x.details&&x.details.length?'<ul>'+x.details.map(function(d){return"<li>"+e(d)+"</li>"}).join("")+"</ul>":"")+'</button>'});
 document.getElementById("list").innerHTML=o}
document.addEventListener("click",function(ev){var c=ev.target.closest&&ev.target.closest(".chip"),it=ev.target.closest&&ev.target.closest(".item");
 if(c){fi=+c.getAttribute("data-i");chips();draw()}else if(it){var id=it.getAttribute("data-id");open[id]=!open[id];draw()}});
var x=new XMLHttpRequest();x.open("GET","/api/devlog?t="+Date.now());x.timeout=8000;
x.onload=function(){try{var j=JSON.parse(x.responseText);all=(j.entries||[]).slice().sort(function(a,b){return(a.date+a.time+a.id)<(b.date+b.time+b.id)?-1:1});
 var l=all[all.length-1];if(l){var t=pd(l.date);document.getElementById("ver").innerHTML="<b>Asher’s tvOS "+e(l.version)+"</b>Latest update "+M[t.getMonth()]+" "+t.getDate()+", "+ck(l.time)}
 chips();draw()}catch(err){fail()}};
x.onerror=x.ontimeout=fail;x.send();
function fail(){document.getElementById("list").innerHTML='<div class="msg">Can’t load the Dev log. Is your phone on the home Wi-Fi?</div>'}
})();
</script></body></html>
